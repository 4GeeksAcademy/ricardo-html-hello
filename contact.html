<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Café Brisa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-amber-50 text-stone-800 font-sans min-h-screen flex flex-col">

  <header class="bg-stone-900 text-amber-50">
    <nav class="max-w-6xl mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-2xl font-bold tracking-wide">Café Brisa</a>
      <ul class="flex gap-6">
        <li><a href="index.html#menu" class="hover:text-amber-400">Menú</a></li>
        <li><a href="index.html#nosotros" class="hover:text-amber-400">Nosotros</a></li>
        <li><a href="contact.html" class="text-amber-400">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <form id="contact-form" novalidate class="bg-white w-full max-w-lg rounded-xl shadow p-8 space-y-5">
      <h1 class="text-3xl font-bold text-center">Contáctanos</h1>

      <div>
        <label for="name" class="block font-medium mb-1">Nombre</label>
        <input id="name" name="name" type="text"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
        <p class="error-msg text-red-600 text-sm mt-1 hidden" data-for="name"></p>
      </div>

      <div>
        <label for="email" class="block font-medium mb-1">Correo</label>
        <input id="email" name="email" type="email"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
        <p class="error-msg text-red-600 text-sm mt-1 hidden" data-for="email"></p>
      </div>

      <div>
        <label for="message" class="block font-medium mb-1">Mensaje</label>
        <textarea id="message" name="message" rows="5"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        <p class="error-msg text-red-600 text-sm mt-1 hidden" data-for="message"></p>
      </div>

      <button type="submit"
        class="w-full bg-amber-500 hover:bg-amber-600 text-stone-900 font-semibold py-3 rounded-lg">
        Enviar
      </button>

      <p id="success-msg" class="hidden text-green-700 text-center font-medium"></p>
    </form>
  </main>

  <footer class="text-center py-6 text-sm text-stone-500">
    &copy; 2026 Café Brisa. Todos los derechos reservados.
  </footer>

  <script src="js/contact.js"></script>
</body>
</html>
